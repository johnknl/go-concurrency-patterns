# The vocabulary of the classification. Pattern pages (docs/patterns/*.md) pick values from here in their
# front matter, and `docsync` validates them and renders the catalogs.

# The principles that the anti-patterns violate. The home page states them; the anchors there are
# principle-<key>.
principle:
  title: Principle
  question: Which principle does the anti-pattern violate?
  values:
    ownership:
      title: Clear ownership
      description: Every goroutine, channel and mutable value has one owner that decides its lifetime and alone closes or mutates it.
    synchronous-first:
      title: Synchronous first
      description: A function does its work in the caller's goroutine and returns; concurrency is the caller's choice and needs a reason.
    simplest-mechanism:
      title: The simplest mechanism that works
      description: Use the lowest rung that solves the problem; climb only when the one below cannot.
    explicit-synchronization:
      title: Synchronize explicitly
      description: Ordering and exclusion come from channels, locks, atomics or wait groups, never from timing; locks are short and ordered.
    bounded:
      title: Bound everything
      description: Goroutines, queues, retries and memory have limits, and the code decides what happens at the limit.
    plain-code:
      title: Plain code over generality
      description: An abstraction or dependency earns its place; misuse is handled by documented contracts.
    explicit-inputs:
      title: Prefer explicit inputs
      description: Prefer behavior that follows from explicit inputs (state, events, and injected clocks and random sources), where the same inputs must give the same result.

purpose:
  title: Purpose
  question: What is the pattern for?
  values:
    data-flow:
      title: Data flow
      description: How values move between goroutines.
    execution:
      title: Execution
      description: Who runs the work, and how the outcome comes back.
    coordination:
      title: Coordination
      description: How goroutines wait for, limit, or choose among each other, and how shared state is kept safe.
    lifecycle:
      title: Lifecycle
      description: How goroutines are stopped, and kept from leaking.
    resilience:
      title: Resilience
      description: How errors, slowness, and failure are handled to keep a system working.

scale:
  title: Scale
  question: How big is the pattern?
  values:
    idiom:
      title: Idiom
      description: One or two mechanisms arranged in a few lines, often a single function.
    pattern:
      title: Pattern
      description: Several cooperating goroutines or parts with distinct roles.
    composite:
      title: Composite
      description: A component built by combining other patterns of this catalog.

mechanism:
  title: Mechanism
  question: Which Go building blocks does it use?
  values:
    channels:
      title: Channels
      description: Sending and receiving on channels, and closing them.
    select:
      title: Select
      description: Waiting on several channel operations at once.
    sync:
      title: Sync
      description: Mutexes, condition variables, wait groups, once, and pools from `sync`.
    atomic:
      title: Atomic
      description: Lock-free operations on single values from `sync/atomic`.
    context:
      title: Context
      description: Cancellation, deadlines, and request-scoped values from `context`.
    time:
      title: Time
      description: Timers, tickers, and durations from `time`.

concern:
  title: Concern
  question: Which problem does it address?
  values:
    determinism:
      title: Determinism
      description: Getting the same result from the same inputs, for replay, tests, and reproducing failures.
    backpressure:
      title: Backpressure
      description: Making a fast producer wait for a slow consumer.
    bounded-concurrency:
      title: Bounded concurrency
      description: Capping how many things run, or how many resources are used, at once.
      guide: >-
        When callers need only permission to proceed, a [Semaphore](../patterns/semaphore.md) bounds how many run at
        once. When a fixed number of distinct, expensive resources such as connections must be shared, a
        [Resource Pool](../patterns/resource-pool.md) hands them out and makes callers wait when all are in use. When
        the work itself should run on a fixed set of long-lived goroutines fed from a queue, use a
        [Worker Pool](../patterns/worker-pool.md). An [Object Cache](../patterns/object-cache.md) reuses temporary
        objects but bounds nothing.
    cancellation:
      title: Cancellation
      description: Stopping work that is no longer needed.
      guide: >-
        A [Deadline](../stdlib/deadline.md) bounds how long the caller waits for an operation, and it only signals
        the operation. [Cooperative cancellation](../concepts/cooperative-cancellation.md) is what makes a long operation notice the
        signal: it checks the context between units, stops within one unit, and leaves state consistent.
        [Context Propagation](../stdlib/context-propagation.md) carries the deadline and the cancellation from the
        top of a request down the call tree, so every step shares one bound.
        [Cancel on Error](../patterns/cancel-on-error.md) handles a group of concurrent tasks that build
        one result: the first failure cancels the rest.
    leak-prevention:
      title: Leak prevention
      description: Making sure that every goroutine can end.
    data-race-safety:
      title: Data race safety
      description: Sharing or handing over data without races.
    error-handling:
      title: Error handling
      description: Carrying, deciding on, and reporting errors from concurrent work.
    latency:
      title: Latency
      description: Answering sooner, or giving up on a slow answer.
    throughput:
      title: Throughput
      description: Doing more work in the same time.
    rate-control:
      title: Rate control
      description: Limiting how often something happens over time.
      guide: >-
        To limit how often an operation starts, choose by what may happen in a short span and whether callers wait or
        are refused. A [Token Bucket](../patterns/token-bucket.md) enforces an average rate and lets a bounded burst
        through after idle time; callers can be refused or wait, and `golang.org/x/time/rate` is the production
        implementation. [Pacing](../patterns/pacing.md) spaces calls one interval apart with no burst; every caller
        waits its turn. To limit how many
        operations run at once instead of how often they start, use a [Semaphore](../patterns/semaphore.md).
    liveness:
      title: Liveness
      description: Knowing that a goroutine is alive, and restoring it when it is not.
    ordering:
      title: Ordering
      description: Restoring or deciding the order of values that arrive out of order.
    batching:
      title: Batching
      description: Combining many small operations into fewer large ones.
    overload:
      title: Overload
      description: Staying correct and responsive when work arrives faster than it can be handled.
    composition:
      title: Composition
      description: Combining small concurrent parts into larger ones.

